# CI/CD for the shipping document verification service.
#
#   test    every push: the suite, plus a real run scored for shape
#   build   on main: build the image, prove it starts, push it to the GitLab registry
#   deploy  on main: wait for the server to pick it up and report the new commit
#
# The image is built HERE, not on the server. A t3.micro has 1 GB of RAM and installing
# pymupdf and pdfplumber on it is a coin flip; pulling a finished image is not.
#
# THERE IS NO SSH ANYWHERE IN THIS PIPELINE, and that is deliberate. GitLab.com
# publishes no static IPs for its shared runners — its own documentation says to
# allowlist "both AWS and Google Cloud IP ranges" — so a CI job that sshs in requires
# opening port 22 to most of a cloud provider. Instead the server polls the registry on
# a one-minute systemd timer (deploy/systemd/) and this pipeline verifies the result
# over HTTPS. CI therefore holds no credentials of any kind, and the security group
# keeps ssh pinned to one address.
#
# ---------------------------------------------------------------------------
# Settings → CI/CD → Variables — one variable, and it is not a secret:
#
#   DEPLOY_HOST   the public hostname, e.g. docmatch.tech
#
# SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, DEPLOY_USER and DEPLOY_PATH are no longer used and
# can be deleted.
# ---------------------------------------------------------------------------

stages: [test, build, deploy]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"
  # Never let CI spend the Claude budget. The suite disables it too (tests/conftest.py),
  # this is the belt to that pair of braces.
  SDOC_LLM: "off"
  LLM_MAX_CALLS: "0"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths: [.cache/pip]

# ---------------------------------------------------------------------------
test:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc >/dev/null
    - pip install --quiet --upgrade pip
    - pip install --quiet -r requirements.txt
  script:
    - echo "── unit and integration tests ──"
    - pytest -q
    - echo "── a real run over the whole inbox ──"
    - python -m src.pipeline --out submission.json
    - echo "── the submission must be shaped exactly as the organizers expect ──"
    - |
      python - <<'PY'
      import json, sys
      from src.submission import validate_submission
      sub = json.load(open("submission.json"))
      problems = validate_submission(sub, "data")
      assert len(sub) == 520, f"expected 520 entries, got {len(sub)}"
      assert not problems, problems
      print(f"submission ok: {len(sub)} entries, no shape problems")
      PY
  artifacts:
    paths: [submission.json]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
build:
  stage: build
  image: docker:27-cli
  services: [docker:27-dind]
  needs: [test]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --build-arg GIT_SHA="$CI_COMMIT_SHORT_SHA" -f deploy/Dockerfile -t "$IMAGE" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE"
    - docker push "$IMAGE_LATEST"
    # the image must actually come up, or we would ship a container that dies on boot
    - docker run -d --name smoke -e SDOC_NO_AUTORUN=1 -p 8000:8000 "$IMAGE"
    - sleep 12
    - docker exec smoke python -c "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
    - docker rm -f smoke
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine:3.20
  needs: [build]
  environment:
    name: production
    url: https://$DEPLOY_HOST
  # NO SSH. The server pulls its own updates on a one-minute systemd timer
  # (deploy/systemd/), and this job waits for /health to report the commit it just
  # built.
  #
  # Why: GitLab.com publishes no static IPs for shared runners — its own docs say to
  # allowlist "both AWS and Google Cloud IP ranges" — so letting CI ssh in means
  # opening port 22 to most of a cloud provider. The security group keeps ssh pinned to
  # one address, CI holds no credentials at all, and a deploy is still verified rather
  # than assumed. The first version of this job did use ssh and failed every run: the
  # runner could not reach the box, which is exactly the firewall doing its job.
  before_script:
    - apk add --no-cache curl >/dev/null
  script:
    # Fail in two seconds with a sentence, not in ten minutes with an empty variable.
    # An unset DEPLOY_HOST makes every curl below target https:///health, which fails
    # silently forty times and then reports "never appeared" — true, and useless.
    - |
      if [ -z "$DEPLOY_HOST" ]; then
        echo "DEPLOY_HOST is not set. Settings -> CI/CD -> Variables -> add"
        echo "DEPLOY_HOST = the public hostname, e.g. docmatch.tech (not a secret)."
        exit 1
      fi
    - echo "waiting for $CI_COMMIT_SHORT_SHA to go live on $DEPLOY_HOST"
    - |
      for i in $(seq 1 40); do
        body=$(curl -fsSL --max-time 10 "https://$DEPLOY_HOST/health" 2>/dev/null \
               || curl -fsSL --max-time 10 "http://$DEPLOY_HOST/health" 2>/dev/null \
               || true)
        case "$body" in
          *"\"version\":\"$CI_COMMIT_SHORT_SHA\""*)
            case "$body" in
              *'"status":"ok"'*)
                echo "live after $((i*15))s"
                echo "$body" | head -c 300
                exit 0 ;;
            esac ;;
        esac
        sleep 15
      done
      echo "$CI_COMMIT_SHORT_SHA never appeared on $DEPLOY_HOST/health after 10 minutes."
      if [ -z "$body" ]; then
        echo "  /health returned nothing at all — the host is unreachable from CI,"
        echo "  so this is DNS, TLS or the security group, not the deploy."
      else
        echo "  last seen: $(echo "$body" | head -c 200)"
        echo "  the host answers but reports a different commit, so the timer has not"
        echo "  pulled yet: journalctl -u sdoc-update -n 40"
      fi
      exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
