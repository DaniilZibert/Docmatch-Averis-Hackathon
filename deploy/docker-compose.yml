# The whole service in one container.
#   docker compose -f deploy/docker-compose.yml up --build   ->  http://localhost:8000
#
# Deliberately a single service. The pipeline processes all 520 emails in under a
# second, so a queue and a database would be moving parts with nothing to move; the
# API keeps results in memory and src/db/schema.sql records the shape a real
# deployment persists. Port 8000 so it can run alongside the organizers' self-eval
# server on 8080.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # optional: without it the service runs rules-only and says so on /health
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
