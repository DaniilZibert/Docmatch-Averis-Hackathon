# Production stack: the app behind Caddy, which gets HTTPS by itself.
#
#   cp .env.example .env && edit it      # SDOC_DOMAIN at minimum
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# NOTE ON .env — this bit is not obvious and cost an afternoon. `docker compose -f
# deploy/x.yml` sets the project directory to deploy/, so it looks for `.env` THERE,
# not in the repository root you ran the command from. Every ${VAR} then quietly falls
# back to its default: the domain stays :80 and you get no certificate, an API key in
# .env is ignored while the UI says "no key", and nothing anywhere reports a problem.
#
# So the services read the root .env explicitly via env_file, whose path resolves
# relative to THIS file and therefore does not care where you invoke compose from.
# Values consequently must NOT be repeated under `environment:` — that key wins over
# env_file and would put the defaults back.
#
# See docs/deploy-aws.md for the full runbook.
services:
  app:
    image: ${SDOC_IMAGE:-sdoc-app:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      # SDOC_LLM, ANTHROPIC_API_KEY, ANTHROPIC_MODEL, LLM_MAX_CALLS, DATA_DIR, ...
      # Claude ships OFF; src/config.py defaults cover anything absent here.
      - path: ../.env
        required: false
    environment:
      # Container paths, not settings — these belong here rather than in .env.
      SDOC_STATE_FILE: /state/sdoc-state.json
    volumes:
      - sdoc_state:/state          # remembers the Claude switch across restarts
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - path: ../.env              # SDOC_DOMAIN
        required: false
    ports:
      # 80/443 in production. Override on a machine where they are taken:
      #   HTTP_PORT=8080 HTTPS_PORT=8443 docker compose -f ... up -d
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # certificates — keep this, or you will re-issue
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - app
    restart: unless-stopped

volumes:
  sdoc_state:
  caddy_data:
  caddy_config:
  caddy_logs:
