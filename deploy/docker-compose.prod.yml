# Production stack: the app behind Caddy, which gets HTTPS by itself.
#
#   cp .env.example .env && edit it      # SDOC_DOMAIN, optionally ANTHROPIC_API_KEY
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# See docs/deploy-aws.md for the full runbook (EC2, security group, DNS).
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # Optional. Without it the service runs rules-only and says so on /health —
      # which is also how you demo safely on a venue's wifi.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      LLM_MAX_CALLS: ${LLM_MAX_CALLS:-40}
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SDOC_DOMAIN: ${SDOC_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates — keep this, or you will re-issue
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
